  <script>

    const PARTICLE_COUNT = 5000;
    const DOT_COLOR_HEX = 0x666666;
    const BLOWOUT_RADIUS = 95.0;
    const BLOWOUT_FORCE = 24.0;
    const RETURN_SPEED = 0.075;

    const LOGO_BASE_WIDTH = 480; // Calibrated base world unit width for comfortable margins

    const G_EMBLEM_SVG = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
        <path fill="#000000" fill-rule="evenodd" d="

    `;

    function rasterizeSVGAndSample(svgMarkup, callback) {
      const blob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();

      img.onload = function () {
        sampleCtx.clearRect(0, 0, sampleCanvas.width, sampleCanvas.height);
        
        // Generous internal canvas padding to prevent any edge clipping
        const padX = 120;
        const padY = 80;
        const scale = Math.min((sampleCanvas.width - padX * 2) / img.width, (sampleCanvas.height - padY * 2) / img.height);
        const drawW = img.width * scale;
        const drawH = img.height * scale;
        const drawX = (sampleCanvas.width - drawW) / 2;
        const drawY = (sampleCanvas.height - drawH) / 2;

        sampleCtx.drawImage(img, drawX, drawY, drawW, drawH);
        URL.revokeObjectURL(url);

        const sampled = extractUniformPointsFromCanvas(PARTICLE_COUNT);
        if (callback) callback(sampled);
      };

      img.src = url;
    }

    function extractUniformPointsFromCanvas(targetCount) {
      const imgData = sampleCtx.getImageData(0, 0, sampleCanvas.width, sampleCanvas.height);
      const data = imgData.data;
      const validPixels = [];

      // Scan step for fine detail extraction
      const step = 2;
      let minX = Infinity, maxX = -Infinity;
      let minY = Infinity, maxY = -Infinity;

      for (let y = 0; y < sampleCanvas.height; y += step) {
        for (let x = 0; x < sampleCanvas.width; x += step) {
          const idx = (y * sampleCanvas.width + x) * 4;
          if (data[idx + 3] > 95) {
            validPixels.push({ x, y });
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      const points = [];
      if (validPixels.length === 0) {
        for (let i = 0; i < targetCount; i++) {
          points.push(new THREE.Vector3((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 80, 0));
        }
        return points;
      }

      // Compute exact center and bounding dimensions of the rendered shape
      const bboxW = Math.max(maxX - minX, 1);
      const bboxH = Math.max(maxY - minY, 1);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;

      // Scale to consistent world unit size with proportional aspect ratio
      const scale = LOGO_BASE_WIDTH / bboxW;
      currentLogoWidth = LOGO_BASE_WIDTH;
      currentLogoHeight = bboxH * scale;

      // Exactly targetCount (5,000) sampled dots with subtle organic depth jitter
      for (let i = 0; i < targetCount; i++) {
        const randIndex = Math.floor(Math.random() * validPixels.length);
        const pixel = validPixels[randIndex];
        const jX = (Math.random() - 0.5) * 1.6;
        const jY = (Math.random() - 0.5) * 1.6;
        const jZ = (Math.random() - 0.5) * 4.0;

        // Perfectly centered coordinates (cx, cy)
        const posX = (pixel.x - cx) * scale + jX;
        const posY = -(pixel.y - cy) * scale + jY;

        points.push(new THREE.Vector3(posX, posY, jZ));
      }

      // Update camera distance to guarantee spacious margins
      updateCameraDistance();

      return points;
    }

    function createCircleTexture() {
      const size = 64;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const center = size / 2;
      const radius = size * 0.44;

      ctx.beginPath();
      ctx.arc(center, center, radius, 0, Math.PI * 2, false);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function init() {
      const canvasEl = document.getElementById('webgl-canvas');
      const width = window.innerWidth;
      const height = window.innerHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);

      camera = new THREE.PerspectiveCamera(45, width / height, 1, 3000);
      updateCameraDistance();

      renderer = new THREE.WebGLRenderer({
        canvas: canvasEl,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);

      // Raycast plane for cursor tracking
      raycaster = new THREE.Raycaster();
      const planeGeo = new THREE.PlaneGeometry(8000, 8000);
      const planeMat = new THREE.MeshBasicMaterial({ visible: false });
      mousePlane = new THREE.Mesh(planeGeo, planeMat);
      scene.add(mousePlane);

      // Initialize buffer arrays for 5,000 particles
      positions = new Float32Array(PARTICLE_COUNT * 3);
      velocities = new Float32Array(PARTICLE_COUNT * 3);
      originalPositions = new Float32Array(PARTICLE_COUNT * 3);

      // Sample and build particle system
      rasterizeSVGAndSample(GAKK_WORDMARK_SVG, (sampledPoints) => {
        applyPointsToSystem(sampledPoints, true);
      });

      // Events
      window.addEventListener('resize', onWindowResize, false);
      window.addEventListener('mousemove', onMouseMove, false);
      window.addEventListener('touchmove', onTouchMove, { passive: true });
      window.addEventListener('click', triggerExplosion, false);

      setupUI();
      setupDropZone();
    }

    function updateCameraDistance() {
      if (!camera) return;
      const fovRad = (camera.fov * Math.PI) / 180;
      const tanHalfFov = Math.tan(fovRad / 2);

      // Desired view occupancy: 65% width and 45% height to ensure generous padding on all sides
      const requiredHFromWidth = (currentLogoWidth / 0.65) / camera.aspect;
      const requiredHFromHeight = currentLogoHeight / 0.45;
      const visibleHeightNeeded = Math.max(requiredHFromWidth, requiredHFromHeight);

      baseCameraZ = Math.max(visibleHeightNeeded / (2 * tanHalfFov), 360);
      camera.position.z = baseCameraZ;
      camera.updateProjectionMatrix();
    }

    function applyPointsToSystem(points, isInitial = false) {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const pt = points[i] || new THREE.Vector3(0, 0, 0);
        const idx = i * 3;

        originalPositions[idx] = pt.x;
        originalPositions[idx + 1] = pt.y;
        originalPositions[idx + 2] = pt.z;

        if (isInitial) {
          positions[idx] = pt.x;
          positions[idx + 1] = pt.y;
          positions[idx + 2] = pt.z;
          velocities[idx] = 0;
          velocities[idx + 1] = 0;
          velocities[idx + 2] = 0;
        } else {
          // Subtle dispersion during shape morphing
          velocities[idx] += (Math.random() - 0.5) * 22;
          velocities[idx + 1] += (Math.random() - 0.5) * 22;
          velocities[idx + 2] += (Math.random() - 0.5) * 30;
        }
      }

      if (isInitial) {
        if (particleGeometry) particleGeometry.dispose();
        if (particleMaterial) particleMaterial.dispose();
        if (particleSystem) scene.remove(particleSystem);

        particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Point size tuned for 5,000 dots
        particleMaterial = new THREE.PointsMaterial({
          size: 2.35,
          color: DOT_COLOR_HEX, // #666666
          map: createCircleTexture(),
          transparent: true,
          opacity: 0.94,
          depthWrite: false,
          sizeAttenuation: true
        });

        particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);
      }
    }

    function setupUI() {
      const btnWordmark = document.getElementById('btn-wordmark');
      const btnEmblem = document.getElementById('btn-emblem');
      const btnBlast = document.getElementById('btn-blast');
      const fileInput = document.getElementById('file-input');
      const btnDownloadZip = document.getElementById('btn-download-zip');

      btnWordmark.addEventListener('click', (e) => {
        e.stopPropagation();
        currentMode = 'wordmark';
        btnWordmark.className = 'px-3.5 py-1 rounded-full bg-zinc-900 text-white font-medium transition-all shadow-sm';
        btnEmblem.className = 'px-3.5 py-1 rounded-full text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 transition-all font-medium';
        rasterizeSVGAndSample(GAKK_WORDMARK_SVG, (pts) => applyPointsToSystem(pts, false));
      });

      btnEmblem.addEventListener('click', (e) => {
        e.stopPropagation();
        currentMode = 'emblem';
        btnEmblem.className = 'px-3.5 py-1 rounded-full bg-zinc-900 text-white font-medium transition-all shadow-sm';
        btnWordmark.className = 'px-3.5 py-1 rounded-full text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 transition-all font-medium';
        rasterizeSVGAndSample(G_EMBLEM_SVG, (pts) => applyPointsToSystem(pts, false));
      });

      btnBlast.addEventListener('click', (e) => {
        e.stopPropagation();
        triggerExplosion();
      });

      if (btnDownloadZip) {
        btnDownloadZip.addEventListener('click', (e) => {
          e.stopPropagation();
          exportProjectZip(btnDownloadZip);
        });
      }

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) handleImageFile(file);
      });
    }

    function exportProjectZip(buttonEl) {
      if (typeof JSZip === 'undefined') return;

      const originalHtml = buttonEl.innerHTML;
      buttonEl.innerHTML = `
        <svg class="animate-spin -ml-0.5 mr-1.5 h-3.5 w-3.5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Packaging...</span>
      `;

      try {
        const zip = new JSZip();

        // 1. Current full index.html
        const currentHtmlSource = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

        // 2. vercel.json (Static Hosting Configuration)
        const vercelConfig = {
          version: 2,
          cleanUrls: true,
          routes: [
            {
              src: "/(.*)",
              dest: "/index.html"
            }

        };
        zip.file("vercel.json", JSON.stringify(vercelConfig, null, 2));

        // 3. package.json
        const packageJson = {
          name: "gakk-3d-particle-logo",
          version: "1.0.0",
          private: true,
          description: "Interactive 3D Particle Logo Header for Gakk using Three.js with 5,000 dots and fluid physics",
          scripts: {
            start: "npx serve ."
          },
          keywords: ["threejs", "webgl", "particles", "gakk", "canvas"],
          author: "Gakk",
          license: "MIT"
        };
        zip.file("package.json", JSON.stringify(packageJson, null, 2));

        // 4. .gitignore
        zip.file(".gitignore", ".DS_Store\nnode_modules\n.vercel\n*.log\n");

        // 5. README.md with direct GitHub and Vercel commands
        const readmeContent = `# Gakk 3D Particle Logo Header

Interactive 3D particle canvas featuring the exact Gakk logo geometry with 5,000 dots, #666666 dot color, and real-time cursor blow-out physics.

        // Generate and initiate download
        zip.generateAsync({ type: "blob" }).then(function (content) {
          const downloadUrl = URL.createObjectURL(content);
          const a = document.createElement("a");

          a.download = "gakk-3d-particle-logo.zip";

    function setupDropZone() {
      const dropZone = document.getElementById('drop-zone');
      const dropModal = document.getElementById('drop-modal');

      window.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropModal.style.display = 'flex';
      });

      window.addEventListener('dragleave', (e) => {
        if (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
          dropModal.style.display = 'none';
        }
      });

      window.addEventListener('drop', (e) => {
        e.preventDefault();
        dropModal.style.display = 'none';
        if (e.dataTransfer && e.dataTransfer.files.length > 0) {
          handleImageFile(e.dataTransfer.files[0]);
        }
      });
    }

    function handleImageFile(file) {
      const reader = new FileReader();
      reader.onload = function (event) {
        const dataUrl = event.target.result;
        const img = new Image();
        img.onload = function () {
          sampleCtx.clearRect(0, 0, sampleCanvas.width, sampleCanvas.height);
          const padX = 120;
          const padY = 80;
          const scale = Math.min((sampleCanvas.width - padX * 2) / img.width, (sampleCanvas.height - padY * 2) / img.height);
          const drawW = img.width * scale;
          const drawH = img.height * scale;
          const drawX = (sampleCanvas.width - drawW) / 2;
          const drawY = (sampleCanvas.height - drawH) / 2;

          sampleCtx.drawImage(img, drawX, drawY, drawW, drawH);
          const newPts = extractUniformPointsFromCanvas(PARTICLE_COUNT);
          applyPointsToSystem(newPts, false);
        };
        img.src = dataUrl;
      };
      reader.readAsDataURL(file);
    }

    function updatePointer(clientX, clientY) {
      targetMouse.x = (clientX / window.innerWidth) * 2 - 1;
      targetMouse.y = -(clientY / window.innerHeight) * 2 + 1;
    }

    function onMouseMove(event) {
      updatePointer(event.clientX, event.clientY);
    }

    function onTouchMove(event) {
      if (event.touches.length > 0) {
        updatePointer(event.touches[0].clientX, event.touches[0].clientY);
      }
    }

    function triggerExplosion() {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        const angle = Math.random() * Math.PI * 2;
        const force = 20 + Math.random() * 32;
        velocities[idx] += Math.cos(angle) * force;
        velocities[idx + 1] += Math.sin(angle) * force;
        velocities[idx + 2] += (Math.random() - 0.5) * 50;
      }
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      updateCameraDistance();
      renderer.setSize(width, height);
    }

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // Smooth cursor interpolation
      mouse.x += (targetMouse.x - mouse.x) * 0.16;
      mouse.y += (targetMouse.y - mouse.y) * 0.16;

      // Project mouse into 3D space
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(mousePlane);
      if (intersects.length > 0) {
        planeIntersection.copy(intersects[0].point);
      }

      // Dynamic camera parallax tilt with base Z retention
      camera.position.x += (mouse.x * 20 - camera.position.x) * 0.04;
      camera.position.y += (mouse.y * 16 - camera.position.y) * 0.04;
      camera.position.z += (baseCameraZ - camera.position.z) * 0.08;
      camera.lookAt(0, 0, 0);

      if (!particleGeometry) return;

      const posAttr = particleGeometry.attributes.position;
      const posArr = posAttr.array;

      const mx = planeIntersection.x;
      const my = planeIntersection.y;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;

        const px = posArr[idx];
        const py = posArr[idx + 1];
        const pz = posArr[idx + 2];

        const ox = originalPositions[idx];
        const oy = originalPositions[idx + 1];
        const oz = originalPositions[idx + 2];

        // 1. Mouse Blow-Out Physics Calculation
        const dx = px - mx;
        const dy = py - my;
        const distSq = dx * dx + dy * dy;
        const radiusSq = BLOWOUT_RADIUS * BLOWOUT_RADIUS;

        if (distSq < radiusSq) {
          const dist = Math.sqrt(distSq) || 0.001;
          const factor = Math.pow(1.0 - dist / BLOWOUT_RADIUS, 1.7);
          const push = factor * BLOWOUT_FORCE;

          velocities[idx] += (dx / dist) * push;
          velocities[idx + 1] += (dy / dist) * push;
          velocities[idx + 2] += (Math.random() - 0.25) * push * 1.4;
        }

        // 2. Elastic spring restoration to exact target coordinates
        velocities[idx] += (ox - px) * RETURN_SPEED;
        velocities[idx + 1] += (oy - py) * RETURN_SPEED;
        velocities[idx + 2] += (oz - pz) * RETURN_SPEED;

        // 3. Subtle organic micro-motion
        const timeOff = elapsedTime * 2.0 + i * 0.05;
        velocities[idx] += Math.sin(timeOff) * 0.03;
        velocities[idx + 1] += Math.cos(timeOff) * 0.03;

        // 4. Friction damping
        velocities[idx] *= FRICTION;
        velocities[idx + 1] *= FRICTION;
        velocities[idx + 2] *= FRICTION;

        // 5. Update position buffer
        posArr[idx] += velocities[idx];
        posArr[idx + 1] += velocities[idx + 1];
        posArr[idx + 2] += velocities[idx + 2];
      }

      posAttr.needsUpdate = true;
      renderer.render(scene, camera);
    }

    window.onload = function () {
      init();
      onWindowResize();
      animate();
    };
  </script>
